$terminal = foot
$menu = fuzzel

monitor = ,preferred,auto,1

input {
    kb_layout = pl
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faff) rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(45475aff)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.96
    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.12
    }
}

animations {
    enabled = true
    bezier = swift,0.25,0.9,0.1,1.0
    bezier = smooth,0.2,0.0,0.0,1.0
    animation = windows,1,4,swift,popin 85%
    animation = windowsOut,1,3,smooth,popin 85%
    animation = border,1,5,swift
    animation = fade,1,3,smooth
    animation = workspaces,1,3,swift,slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

bind = SUPER, Return, exec, $terminal
bind = SUPER, D, exec, $menu
bind = SUPER, E, exec, thunar
bind = SUPER, L, exec, hyprlock
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen, 0
bind = SUPER, V, togglefloating,
bind = SUPER, P, pseudo,
bind = SUPER, J, togglesplit,

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER CTRL, left, resizeactive, -40 0
bind = SUPER CTRL, right, resizeactive, 40 0
bind = SUPER CTRL, up, resizeactive, 0 -40
bind = SUPER CTRL, down, resizeactive, 0 40
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = , Print, exec, sh -c 'grim - | wl-copy'
bind = SHIFT, Print, exec, sh -c 'grim -g "$(slurp)" - | wl-copy'
bind = SUPER, S, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots" && grim "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png"'
bind = SUPER SHIFT, S, exec, sh -c 'selection="$(slurp)" && mkdir -p "$HOME/Pictures/Screenshots" && grim -g "$selection" "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png"'

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

exec-once = uwsm app -- waybar
exec-once = uwsm app -- mako
exec-once = uwsm app -- hyprpaper
exec-once = uwsm app -- hypridle
