background {
    monitor =
    color = rgba(1e1e2eff)
}

input-field {
    monitor =
    size = 280, 54
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgba(89b4faff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(cdd6f4ff)
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
